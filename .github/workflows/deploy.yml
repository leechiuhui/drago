name: Build and Deploy to GitHub Pages

on:
  # 當推送到 main 分支時觸發
  push:
    branches: [ main ]
  
  # 當對 main 分支建立 pull request 時觸發
  pull_request:
    branches: [ main ]
  
  # 允許手動觸發
  workflow_dispatch:

# 設定權限
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同時只有一個部署任務在執行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 建置任務
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Lint
      run: yarn lint
      
    - name: Build
      run: yarn build
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: dist/

  # 部署任務 (只在 main 分支執行)
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2 